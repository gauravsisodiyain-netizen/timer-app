name: Build APK from Zip

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # IMPORTANT:
      # Do NOT use cache: gradle here because the Gradle project
      # is inside the ZIP and does not exist yet.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          echo "Extracting Android project..."

          unzip -o Premium3DTimer_Final.zip -d extracted

          echo ""
          echo "Searching for Android project..."

          SETTINGS_FILE=$(find extracted -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project not found."
            echo ""
            echo "Files inside ZIP:"
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          ls -la "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure JVM 17
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          cat > jvm-fix.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  options.release.set(17)
              }
          }

          gradle.projectsEvaluated {
              allprojects {
                  tasks.matching {
                      it.name.contains("Kotlin", ignoreCase: true) &&
                      it.name.contains("Compile", ignoreCase: true)
                  }.configureEach {
                      try {
                          kotlinOptions.jvmTarget = "17"
                      } catch (Exception ignored) {
                      }
                  }
              }
          }
          EOF

      - name: Make Gradle Wrapper Executable
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew was not found."
            echo ""
            echo "Project contents:"
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          chmod +x ./gradlew

      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./gradlew --version

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --info \
            -I jvm-fix.gradle

      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "Searching for APK..."

          find . \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: timer-app-debug-apk
          path: '${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
