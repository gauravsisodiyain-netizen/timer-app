name: Build APK from Zip

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip and Build APK
        run: |
          # Extract the project files
          unzip -o Premium3DTimer_Final.zip
          
          # Find the root of the Android project
          SETTINGS_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Error: settings.gradle not found!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Navigating to project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Ensure Gradle wrapper exists and is executable
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          
          # Build the APK (skipping lint and tests to prevent strict CI failures)
          ./gradlew assembleDebug -x lint -x test --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
