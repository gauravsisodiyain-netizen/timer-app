name: Build APK from Zip

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout Repository
        uses: actions/checkout@v5


      # 2. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # 3. Extract Android project
      - name: Extract Android Project
        run: |
          set -e

          echo "Extracting Android project..."

          unzip -o Premium3DTimer_Final.zip -d extracted

          echo ""
          echo "Searching for Android project..."

          SETTINGS_FILE=$(find extracted -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project not found!"
            echo ""
            echo "Files found in ZIP:"
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          ls -la "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # 4. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6


      # 5. Fix Java/Kotlin JVM target
      - name: Configure JVM 17
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "Configuring Java and Kotlin to use JVM 17..."

          cat > jvm17.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  options.release = 17
              }

              tasks.matching {
                  it.class.name == "org.jetbrains.kotlin.gradle.tasks.KotlinCompile"
              }.configureEach {
                  kotlinOptions.jvmTarget = "17"
              }
          }
          EOF

          echo ""
          echo "JVM 17 configuration created."


      # 6. Make Gradle wrapper executable
      - name: Make Gradle Wrapper Executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew


      # 7. Check Gradle
      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew --version


      # 8. Build Debug APK
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew \
            --init-script jvm17.gradle \
            assembleDebug \
            --stacktrace


      # 9. Find APK
      - name: Find APK
        run: |
          echo "Searching for APK..."

          find "${{ env.PROJECT_DIR }}" \
            -type f \
            -name "*.apk" \
            -print


      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: timer-app-debug-apk
          path: '${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
