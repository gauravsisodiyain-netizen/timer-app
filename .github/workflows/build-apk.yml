name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Find and extract Android project ZIP
        shell: bash
        run: |
          set -e

          echo "Files in repository:"
          find . -maxdepth 3 -type f -print

          ZIP_FILE=$(find . -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file was found in the repository."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          echo "Extracted files:"
          find project -maxdepth 4 -type f -print

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Premium-3D-Timer-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
